[project]
name = "tinyprotocol-backend"
version = "0.1.0"
description = "TinyProtocol API — a GA1-aware feed & care tracker for newborns."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "mangum>=0.17",
    "boto3>=1.34",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pydantic-settings>=2.3",
    "python-ulid>=2.6",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
