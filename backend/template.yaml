AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TinyProtocol API — GA1-aware newborn feed tracker.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Enables the AI assistant endpoints when set.

Globals:
  Function:
    Runtime: python3.12
    # The assistant's tool loop can take a while; API Gateway caps at 30s.
    Timeout: 29
    MemorySize: 512

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    # Never let a stack operation take the data with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub TinyProtocol-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tinyprotocol-api-${Stage}
      CodeUri: .
      Handler: app.main.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          JWT_SECRET: !Ref JwtSecret
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          STAGE: !Ref Stage
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
