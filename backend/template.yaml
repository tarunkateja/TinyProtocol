AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TinyProtocol API — GA1-aware newborn feed tracker.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Enables the AI assistant endpoints when set.

Globals:
  Function:
    Runtime: python3.12
    # The assistant's tool loop can take a while; API Gateway caps at 30s.
    Timeout: 29
    MemorySize: 512

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    # Never let a stack operation take the data with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub TinyProtocol-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub tinyprotocol-docs-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tinyprotocol-worker-${Stage}
      CodeUri: .
      Handler: app.worker.handler
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          JWT_SECRET: !Ref JwtSecret
          OPENAI_API_KEY: !Ref OpenAiApiKey
          DOCS_BUCKET: !Ref DocsBucket
          STAGE: !Ref Stage
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3CrudPolicy:
            BucketName: !Sub tinyprotocol-docs-${Stage}-${AWS::AccountId}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub tinyprotocol-api-${Stage}
      CodeUri: .
      Handler: app.main.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          JWT_SECRET: !Ref JwtSecret
          OPENAI_API_KEY: !Ref OpenAiApiKey
          DOCS_BUCKET: !Ref DocsBucket
          WORKER_FUNCTION_NAME: !Ref WorkerFunction
          STAGE: !Ref Stage
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - S3CrudPolicy:
            BucketName: !Sub tinyprotocol-docs-${Stage}-${AWS::AccountId}
        - LambdaInvokePolicy:
            FunctionName: !Sub tinyprotocol-worker-${Stage}
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
